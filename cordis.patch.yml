# Usage & billing bundle: one Host unit (the `usageBilling` session projection)
# plus one Client pill in the composer dock.
#
# The plugin prices every model attempt with DeepSeek's official peak/idle
# time-slot prices. The table below is the shipped fallback (official prices of
# 2026-11-04). With `autoRefresh: true` the Host reads the official pricing
# document and the statutory-holiday calendar, so the numbers follow both a
# price change and each holiday without editing this file.
#
# Override the whole row config in the profile patch when needed; a matching
# override replaces the complete `config`, so restate every key you keep.
- insert:
    - id: usage-billing
      name: '@vacum972/dsh-usage-billing'
      config:
        currency: CNY
        # Peak windows are wall-clock times in `timeZone`; everything else is idle.
        timeZone: Asia/Shanghai
        peakWindows:
          - '09:00-12:00'
          - '14:00-18:00'
        peakWeekdays: [1, 2, 3, 4, 5]
        # Extra statutory holidays (YYYY-MM-DD). Leave empty to use only the
        # fetched Chinese statutory holiday calendar.
        holidays: []
        autoRefresh: true
        refreshMinutes: 30
        priceUrl: 'https://api-docs.deepseek.com/zh-cn/quick_start/pricing.md'
        holidayUrl: 'https://timor.tech/api/holiday/year/{year}'
        # Shipped fallback (official table of 2026-11-04). `idle` is half of `peak`.
        default:
          peak: { cacheRead: 0.04, cacheMiss: 2, cacheWrite: 0, output: 8 }
          idle: { cacheRead: 0.02, cacheMiss: 1, cacheWrite: 0, output: 4 }
        models:
          deepseek-flash:
            peak: { cacheRead: 0.04, cacheMiss: 2, cacheWrite: 0, output: 8 }
            idle: { cacheRead: 0.02, cacheMiss: 1, cacheWrite: 0, output: 4 }
          deepseek-v4-pro:
            peak: { cacheRead: 0.3, cacheMiss: 9.0, cacheWrite: 0, output: 27.0 }
            idle: { cacheRead: 0.15, cacheMiss: 4.5, cacheWrite: 0, output: 13.5 }
